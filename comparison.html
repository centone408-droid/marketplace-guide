<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивное Сравнение Маркетплейсов</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { margin-bottom: 30px; text-align: center; color: var(--primary); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; background: #f1f5f9; padding: 25px; border-radius: 16px; }
        input, select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; width: 100%; }
        .table-container { overflow-x: auto; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 700; }
        .profit-high { color: #10b981; font-weight: 700; }
        .profit-low { color: #ef4444; }
        .chart-container { height: 400px; margin-top: 50px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Вернуться на главную</a>
        <h1>📊 Интерактивный Анализ Маркетплейсов</h1>
        
        <div class="controls">
            <div>
                <label>Цена закупа (тг):</label>
                <input type="number" id="buyPrice" value="2000" oninput="updateAll()">
            </div>
            <div>
                <label>Цена продажи (тг):</label>
                <input type="number" id="sellPrice" value="6000" oninput="updateAll()">
            </div>
            <div>
                <label>Сортировать по:</label>
                <select id="sortBy" onchange="updateAll()">
                    <option value="profit">Прибыли (убывание)</option>
                    <option value="commission">Комиссии (возрастание)</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table id="compareTable">
                <thead>
                    <tr>
                        <th>Маркетплейс</th>
                        <th>Комиссия</th>
                        <th>Логистика</th>
                        <th>Налог (3%)</th>
                        <th>Чистая прибыль</th>
                        <th>ROI</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="chart-container">
            <canvas id="profitChart"></canvas>
        </div>
    </div>

    <script>
        const markets = [
            { name: "Kaspi.kz", comm: 0.15, ship: 500 },
            { name: "Ozon.kz", comm: 0.12, ship: 600 },
            { name: "Wildberries", comm: 0.18, ship: 450 },
            { name: "Satu.kz", comm: 0.05, ship: 300 },
            { name: "Halyk Market", comm: 0.10, ship: 550 },
            { name: "Jusan Магазин", comm: 0.12, ship: 500 },
            { name: "OLX (Бизнес)", comm: 0.02, ship: 800 }
        ];

        let chart;

        function updateAll() {
            const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
            const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
            const sort = document.getElementById('sortBy').value;

            let data = markets.map(m => {
                const commVal = sell * m.comm;
                const tax = sell * 0.03;
                const profit = sell - buy - commVal - m.ship - tax;
                const roi = buy > 0 ? (profit / buy * 100) : 0;
                return { ...m, profit, roi, commVal };
            });

            if (sort === "profit") data.sort((a, b) => b.profit - a.profit);
            else data.sort((a, b) => a.comm - b.comm);

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map(m => `
                <tr>
                    <td><strong>${m.name}</strong></td>
                    <td>${(m.comm * 100).toFixed(0)}% (${Math.round(m.commVal)} тг)</td>
                    <td>${m.ship} тг</td>
                    <td>${Math.round(sell * 0.03)} тг</td>
                    <td class="${m.profit > 0 ? 'profit-high' : 'profit-low'}">${Math.round(m.profit).toLocaleString()} тг</td>
                    <td>${Math.round(m.roi)}%</td>
                </tr>
            `).join('');

            updateChart(data);
        }

        function updateChart(data) {
            const ctx = document.getElementById('profitChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(m => m.name),
                    datasets: [{
                        label: 'Чистая прибыль (тг)',
                        data: data.map(m => m.profit),
                        backgroundColor: data.map(m => m.profit > 0 ? '#4f46e5' : '#ef4444'),
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        updateAll();
    </script>
</body>
</html>
